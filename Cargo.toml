[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-auth-routing"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Transport-neutral authentication route and authorization contracts"
license = "Apache-2.0"
readme = "README.md"
publish = ["ecosystem-private"]
repository = "https://github.com/crowsi-net/crowsi-auth-routing"

[workspace]
members = ["."]
resolver = "3"

[features]
default = []
test-support = []

[dependencies]
ed25519-dalek = "2.2.0"
getrandom = "0.3.4"
hex = "0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0", registry = "ecosystem-private" }
libc = "0.2.187"
nix = { version = "0.29.0", features = ["fs", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[dev-dependencies]
tempfile = "3.27.0"
